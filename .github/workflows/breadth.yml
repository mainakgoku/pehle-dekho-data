name: breadth

# Today's breadth and today's sector moves, computed in the cloud so the phone
# does not have to make 525 network calls. Runs hourly through the trading day.

on:
  schedule:
    - cron: '45 3-9 * * 1-5'      # hourly, 09:15-15:15 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute today's breadth
        run: python tools/collect_breadth.py
      - name: Commit
        run: |
          git config user.name  "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add data/live-breadth.json
          if git diff --staged --quiet; then echo "no change"; else
            git commit -m "live breadth: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
